# Astro automatically merges this file with its own docker-compose.
services:
  mongo:
    image: mongo:7.0
    container_name: mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123      # local lab only
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db                      # PERSISTENT STORAGE
    networks:
      - airflow                                  # DOCKER NETWORKING (same network as Airflow)

  mongo-express:
    image: mongo-express:1.0.2-20
    container_name: mongo-express
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://admin:admin123@mongo:27017/
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
    ports:
      - "8081:8081"
    volumes:
      - mongo_express_data:/data                 # PERSISTENT STORAGE
    networks:
      - airflow                                  # DOCKER NETWORKING

volumes:
  mongo_data:
  mongo_express_data:
